<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Go Backend Lab — Go services, standard library first.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03101a"/><stop offset="1" stop-color="#06283d"/></linearGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".06"/></pattern>
  </defs>
  <style>
    .flow{stroke-dasharray:8 10;animation:flow 1.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}
    .draw{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 5s ease-in-out infinite}@keyframes draw{0%,10%{stroke-dashoffset:700}50%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:700}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
    .float{animation:float 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-10px)}}
    .flame{transform-box:fill-box;transform-origin:top;animation:fl .25s ease-in-out infinite alternate}@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
    .tw{animation:tw 2s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 4s ease-in-out infinite}@keyframes grow{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}
    .slide{animation:slide 4s ease-in-out infinite}@keyframes slide{0%,100%{opacity:.35}30%,70%{opacity:1}}
    .needle{transform-box:view-box;transform-origin:130px 200px;animation:needle 4s ease-in-out infinite}@keyframes needle{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(55deg)}}
    .scan{animation:scan 3s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(100px)}}
    .bubble{animation:bub 3s ease-in infinite}@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
    .d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
    text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}</style>
  <rect width="1280" height="400" fill="url(#bg)"/><rect width="1280" height="400" fill="url(#grid)"/>
  <g transform="translate(90 70)" filter="url(#glow)">
    <path d="M90 40 V120 L30 220 H250 L190 120 V40" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
    <line x1="75" y1="40" x2="205" y2="40" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M55 180 H225 L250 220 H30 Z" fill="#34d399" fill-opacity=".35"/>
    <circle cx="110" cy="195" r="7" fill="#fff" class="bubble"/><circle cx="150" cy="205" r="5" fill="#fff" class="bubble d2"/><circle cx="180" cy="190" r="6" fill="#fff" class="bubble d3"/></g>
  <text x="430" y="180" font-size="96" font-weight="800" fill="url(#t)" filter="url(#glow)">Go Backend Lab</text>
  <text x="434" y="232" font-size="32" fill="#bae6fd">Go services, standard library first.</text>
  <g font-size="18" font-weight="600" transform="translate(434 272)"><g transform="translate(0 0)"><rect width="124" height="38" rx="19" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-opacity=".6"/><text x="62.0" y="25" text-anchor="middle" fill="#f8fafc">5 services</text></g><g transform="translate(138 0)"><rect width="54" height="38" rx="19" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-opacity=".6"/><text x="27.0" y="25" text-anchor="middle" fill="#f8fafc">JWT</text></g><g transform="translate(206 0)"><rect width="124" height="38" rx="19" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-opacity=".6"/><text x="62.0" y="25" text-anchor="middle" fill="#f8fafc">PostgreSQL</text></g></g>
</svg>
